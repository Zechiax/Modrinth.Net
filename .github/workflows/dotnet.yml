name: .NET (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Runs every Sunday at 4 AM UTC
    - cron: "0 4 * * 0"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet: [ '8.x', '10.x' ]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test on Pull Requests (Unauthenticated only)
        if: github.event_name == 'pull_request'
        run: dotnet test --no-build --verbosity normal --filter "Category!=Authenticated"

      - name: Test on Main Branch & Scheduled Runs (All tests)
        if: github.event_name != 'pull_request'
        env:
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_TOKEN }}
        run: dotnet test --no-build --verbosity normal

  publish:
    name: Pack & publish to NuGet
    needs: build-and-test
    # Only publish for pushes to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      # Publish
      - name: publish on version change
        id: publish_nuget
        uses: alirezanet/publish-nuget@v3.1.0
        with:
          # Filepath of the project to be packaged, relative to root of repository
          PROJECT_FILE_PATH: src/Modrinth.Net/Modrinth.Net.csproj
          
          # API key to authenticate with NuGet server
          NUGET_KEY: ${{secrets.NUGET_API_KEY}}
          
          # Regex pattern to extract version info in a capturing group
          VERSION_REGEX: ^\s*<PackageVersion>(.*)<\/PackageVersion>\s*$
          
          # Flag to toggle git tagging, enabled by default
          TAG_COMMIT: true
          
          # Configuration to build and package
          # BUILD_CONFIGURATION: Release
          
          # Platform target to compile (default is empty/AnyCPU)
          # BUILD_PLATFORM: x64          
          
          # NuGet package id, used for version detection & defaults to project name
          # PACKAGE_NAME: Core
          
          # Filepath with version info, relative to root of repository & defaults to PROJECT_FILE_PATH
          # VERSION_FILE_PATH: Directory.Build.props
          
          # Useful with external providers like Nerdbank.GitVersioning, ignores VERSION_FILE_PATH & VERSION_REGEX
          # VERSION_STATIC: 1.0.0

          # Format of the git tag, [*] gets replaced with actual version
          # TAG_FORMAT: v*

          # NuGet server uri hosting the packages, defaults to https://api.nuget.org
          # NUGET_SOURCE: https://api.nuget.org

          # Flag to toggle pushing symbols along with nuget package to the server, disabled by default
          INCLUDE_SYMBOLS: true

      # PACKAGE_NAME is only set when a new package was actually pushed;
      # VERSION is the created tag (e.g. v3.8.1), so strip the "v" for Release Drafter
      - name: Get released version
        id: release_version
        if: steps.publish_nuget.outputs.PACKAGE_NAME != ''
        env:
          TAG: ${{ steps.publish_nuget.outputs.VERSION }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: steps.publish_nuget.outputs.PACKAGE_NAME != ''
        uses: release-drafter/release-drafter@v7
        with:
          version: ${{ steps.release_version.outputs.version }}
          publish: true
